name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-train:
    name: Test Data & ML Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Dataset and Pipeline
        run: |
          python -c "import pandas as pd; df = pd.read_csv('telco.csv'); assert len(df) > 0"
          python train.py
          python -c "import joblib; m = joblib.load('churn_model.pkl'); assert m['roc_auc'] > 0.8"

  docker:
    name: Build Docker Container
    needs: test-and-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: churn-predictor:latest
